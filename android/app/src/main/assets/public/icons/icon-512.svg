<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Connection nodes - three interconnected circles representing community -->
  <g transform="translate(256,256)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Orbits -->
    <path d="M-72-22a72 72 0 1 1 20-52" stroke-width="8" opacity="0.8"/>
    <path d="M72-22a72 72 0 1 0-20-52" stroke-width="8" opacity="0.8"/>
    <path d="M0 116a72 72 0 1 1 0-136" stroke-width="8" opacity="0.8"/>
  </g>
  <g transform="translate(256,256)">
    <!-- Center node -->
    <circle cx="0" cy="-52" r="22" fill="#ffffff" stroke="none"/>
    <!-- Orbiting nodes -->
    <circle cx="-72" cy="48" r="16" fill="#ffffff" opacity="0.85" stroke="none"/>
    <circle cx="72" cy="48" r="16" fill="#ffffff" opacity="0.85" stroke="none"/>
  </g>
</svg>
