  <script>
    // Hide Freebuff dev toolbar overlay immediately
    var hideToolbar = function() {
      var el = document.querySelector('[aria-modal="true"][role="dialog"]');
      if (el) { el.style.display = 'none'; }
      var els = document.querySelectorAll('[style*="z-index: 99999"]');
      els.forEach(function(e) { if (e.getAttribute('role') === 'dialog') e.style.display = 'none'; });
    };
    hideToolbar();
    // Also watch for it being added dynamically
    var observer = new MutationObserver(function() { hideToolbar(); });

    // Stop observing after 5 seconds
    setTimeout(function() { observer.disconnect(); }, 5000);
